#############################
### ENVIRONMENT VARIABLES ###
#############################

# Aquamarine (multi-GPU)
# Display/compositor runs on the AMD iGPU (PCI 15:00.0) so the desktop survives
# RTX 3090 Xid faults. Addressed by a stable alias because /dev/dri/cardN
# numbering is assigned at probe time and is not stable across boots or driver
# reloads. The 3090 is listed second so a monitor replugged into it still lights up.
#
# NOT /dev/dri/by-path/pci-0000:15:00.0-card: aquamarine splits AQ_DRM_DEVICES on
# ':', so a by-path name shreds on its own PCI colons and no device is found --
# the backend then fails to build and Hyprland aborts during initServer.
# gpu-amd / gpu-nvidia are colon-free aliases for the same nodes, created by
# /etc/udev/rules.d/61-drm-stable-names.rules.
# 3090 IS OUT (RMA, 2026-08-30). Both aliases vanished with it: the udev rule
# keyed gpu-amd on PCI 15:00.0, and pulling the card collapsed a bridge and
# renumbered the iGPU to 14:00.0. Aquamarine then had two unopenable paths,
# CBackend::create() failed and Hyprland aborted -> TTY only.
#
# Left unset on purpose: with a single DRM device aquamarine enumerates and
# picks it with no help. Restore the line below when the 3090 goes back in --
# and fix the udev rule to key on DRIVERS, not on the PCI address (see
# ~/fix-gpu.sh).
#env = AQ_DRM_DEVICES,/dev/dri/gpu-amd:/dev/dri/gpu-nvidia

# SSH
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent.socket

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# GPU split: AMD iGPU drives the display, RTX 3090 stays free for CUDA/local AI.
#
# CUDA workloads (ollama, PyTorch) reach the 3090 through /dev/nvidia* and
# libcuda directly. They do not consult any variable below, so pointing the
# display stack at AMD costs nothing on the compute side.
#
# Removed when the monitor moved to the iGPU port:
#   GBM_BACKEND=nvidia-drm          buffers are allocated on amdgpu now
#   __GLX_VENDOR_LIBRARY_NAME=nvidia forced every GL app onto the wrong GPU
#   __GL_GSYNC_ALLOWED / __GL_VRR_ALLOWED  NVIDIA-display-only, inert here
#   LIBVA_DRIVER                    not a real libva variable
#   NVD_BACKEND                     nvidia-vaapi-driver only
env = LIBVA_DRIVER_NAME,radeonsi
env = VDPAU_DRIVER,radeonsi

# Firefox
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DISABLE_RDD_SANDBOX,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Toolkit Scale
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_SCALE,1
