#################
### AUTOSTART ###
#################

# Portal and environment setup.
# Export first, reset second: xdg-desktop-portal-hyprland.service has
# ConditionEnvironment=WAYLAND_DISPLAY. exec-once entries fire concurrently, not
# in file order, so the reset script waits for the variable rather than trusting
# the order below -- keep the order anyway, it documents the dependency.
# Under uwsm these two exports are redundant (uwsm populates the activation
# environment itself) but harmless, and they keep a plain hyprland.desktop
# session working.
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.config/hypr/scripts/xdg-desktop-portal-reset.sh

# Services
exec-once = systemctl --user start hyprpolkitagent
exec-once = systemctl --user restart dunst
exec-once = hypridle
exec-once = hyprpm reload

# UI
# waybar runs under waybar.service (supervised, so a wl_output teardown can't
# leave the bar gone). The service autostarts at login, so this only needs to
# apply the theme and restart it to pick the fresh config up.
exec-once = ~/.local/bin/theme set catppuccin && systemctl --user restart waybar.service
exec-once = ~/.config/hypr/scripts/handle-monitors.sh --listen
# Wallpaper: awww-daemon runs under awww-daemon.service; wallpaper-init just
# starts it and restores the image (handles animated GIFs; hyprpaper wouldn't
# apply wallpapers from its config here).
exec-once = ~/.local/bin/wallpaper-init
exec-once = ~/.config/hypr/scripts/set-cursor.sh

# Utilities
exec-once = clipse -listen
exec-once = udiskie
