################
### MONITORS ###
################

#monitor=HDMI-A-4, 2560x1440, 0x0, 1
#monitor=eDP-1, 1920x1080, 2560x0, 1
monitor=eDP-1, 1920x1080, 0x0, 1
monitor=HDMI-A-1, 2560x1440, 1920x-340, 1, bitdepth, 10

# Desktop, 3090 removed 2026-08-30: the VA2719-2K came back up on the iGPU's
# DP-1 rather than HDMI-A-1. bitdepth 10 deliberately omitted -- re-add
# ", bitdepth, 10" once the link is confirmed stable at this refresh rate.
monitor=DP-1, preferred, 0x0, 1

# Catch-all so an output with no rule still lights up instead of staying dark.
# An empty monitor name is Hyprland's fallback: it applies only to outputs that
# match no named rule, so it does not override DP-1 above.
monitor=, preferred, auto, 1
