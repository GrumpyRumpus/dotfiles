# Hardware watchdog (SP5100 TCO, /dev/watchdog0).
#
# Added 2026-09-01 after a silent hard lockup at 21:47 that wrote nothing at
# all: no panic, no OOM, no MCE, no hung-task. PID 1 pets the watchdog every
# RuntimeWatchdogSec/2; if the box wedges, the chip resets it instead of
# sitting dead until someone hits the power button.
#
# 60s is deliberately generous so a heavily loaded box (ollama, bench runs)
# cannot trip it spuriously.
[Manager]
RuntimeWatchdogSec=60
RebootWatchdogSec=10min
