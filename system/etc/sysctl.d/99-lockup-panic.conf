# Turn undiagnosable freezes into recorded, self-recovering panics.
# Added 2026-09-01 alongside the systemd watchdog.

# A hard lockup (CPU wedged, NMI still delivered) becomes a panic instead of a
# silent hang, so the kernel gets a chance to print a backtrace.
kernel.hardlockup_panic = 1

# An oops usually leaves the machine half-dead; panic instead so it reboots.
kernel.panic_on_oops = 1

# Reboot 20s after a panic. Long enough to photograph the trace off the screen,
# short enough to self-recover unattended.
kernel.panic = 20

# NOT enabling kernel.softlockup_panic: a soft lockup is often just a very busy
# CPU, and this box runs long ollama/bench jobs. It would reboot on load.
